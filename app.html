<style>
:root{
  --blue:#8b2fd6; --blue-2:#9d4ee0; --blue-050:#f3ebfc;
  --ink:#0a0d14; --slate:#4a5163; --gray:#8b91a1; --line:#e7eaf1; --mist:#f5f7fb; --white:#fff;
  --green:#16b8a6; --amber:#ff9f43; --red:#ff5a5f;
  --r:14px; --r-lg:20px; --sh:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.05);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --display:"Sora","Inter",sans-serif; --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--mist);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:var(--blue);color:#fff}
h1,h2,h3,h4{font-family:var(--display);letter-spacing:-.02em;line-height:1.15}
.muted{color:var(--gray)}
img{display:block;max-width:100%}

/* shell */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.15rem;padding:6px 8px 16px}
.brand .m{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:800;box-shadow:0 8px 20px rgba(139,47,214,.35)}
.brand span{color:var(--blue)}
.role-chip{margin:0 8px 14px;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);background:var(--blue-050);padding:6px 10px;border-radius:8px;display:inline-block;width:fit-content}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;font-weight:500;font-size:.92rem;color:var(--slate);transition:background .15s,color .15s}
.nav a svg{width:18px;height:18px;flex-shrink:0;opacity:.8}
.nav a:hover{background:var(--mist)}
.nav a.active{background:var(--blue-050);color:var(--blue);font-weight:600}
.nav a.active svg{opacity:1}
.side-foot{border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
.switcher{display:flex;background:var(--mist);border-radius:10px;padding:3px;margin-bottom:10px}
.switcher button{flex:1;font-size:.72rem;font-weight:600;padding:7px 4px;border-radius:8px;color:var(--gray)}
.switcher button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.user{display:flex;align-items:center;gap:10px;padding:6px 8px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.8rem;flex-shrink:0;background:linear-gradient(140deg,#9d4ee0,#4a1a86)}
.user .n{font-size:.85rem;font-weight:600;line-height:1.2}
.user .e{font-size:.72rem;color:var(--gray)}

/* main */
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:20;background:rgba(245,247,251,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:14px 28px}
.topbar h1{font-size:1.3rem}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--gray);font-size:.85rem;min-width:200px}
.search svg{width:15px;height:15px}
.icon-btn{width:38px;height:38px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--slate)}
.icon-btn svg{width:18px;height:18px}
.content{padding:28px}
.wrapx{max-width:1100px;margin:0 auto}

/* primitives */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
.pad{padding:22px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.88rem;padding:10px 16px;border-radius:10px;background:var(--blue);color:#fff;transition:.15s;box-shadow:0 6px 16px rgba(139,47,214,.28)}
.btn:hover{background:var(--blue-2)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:.8rem}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;padding:4px 10px;border-radius:100px;background:var(--mist);color:var(--slate)}
.pill.blue{background:var(--blue-050);color:var(--blue)}
.pill.green{background:rgba(22,184,166,.12);color:#0e8b7e}
.pill.amber{background:rgba(255,159,67,.14);color:#c9741a}
.pill.red{background:rgba(255,90,95,.12);color:#d63b40}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gray)}
.big{font-family:var(--display);font-weight:800;font-size:2rem;letter-spacing:-.03em;line-height:1}
.sub{font-size:.82rem;color:var(--gray);margin-top:4px}
.divide{height:1px;background:var(--line);margin:16px 0}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--gray);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);font-size:.88rem}
tr:last-child td{border-bottom:none}
.trow:hover{background:var(--mist);cursor:pointer}
.progress{height:8px;border-radius:100px;background:var(--mist);overflow:hidden}
.progress i{display:block;height:100%;background:var(--blue);border-radius:100px}
.progress i.g{background:var(--green)}.progress i.a{background:var(--amber)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex-shrink:0;transition:.15s}
.check.done{background:var(--green);border-color:var(--green);color:#fff}
.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:none}
.ring{transform:rotate(-90deg)}
.list-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.tag{font-size:.7rem;font-weight:600;color:var(--gray);background:var(--mist);padding:3px 8px;border-radius:6px}
.hero-day{background:repeating-linear-gradient(45deg,rgba(197,155,242,.09) 0 1px,transparent 1px 42px),repeating-linear-gradient(-45deg,rgba(197,155,242,.09) 0 1px,transparent 1px 42px),linear-gradient(135deg,#1a0b2e,#3a1a7a);color:#fff;border:none}
.hero-day .eyebrow{color:#c9a8ee}
.msg{display:flex;gap:10px;margin-bottom:14px}
.msg .bubble{background:var(--mist);padding:10px 14px;border-radius:14px;font-size:.88rem;max-width:75%}
.msg.me{flex-direction:row-reverse}
.msg.me .bubble{background:var(--blue);color:#fff}
.kpi .big{font-size:1.7rem}
.stack-mod{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;font-size:.85rem;font-weight:500}
.stack-mod .h{margin-left:auto;color:var(--gray);cursor:grab}
.chip-add{border:1px dashed var(--line);color:var(--blue);border-radius:12px;padding:11px;text-align:center;font-weight:600;font-size:.85rem;cursor:pointer}
.seg{display:inline-flex;background:var(--mist);border-radius:10px;padding:3px}
.seg button{font-size:.8rem;font-weight:600;padding:6px 14px;border-radius:8px;color:var(--gray)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.mobile-only{display:none}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;z-index:50;width:250px;transform:translateX(-100%);transition:transform .3s var(--ease);box-shadow:0 20px 60px rgba(0,0,0,.2)}
  body.menu .side{transform:none}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .content{padding:18px}
  .mobile-only{display:grid}
  .search{display:none}
  .backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
  body.menu .backdrop{display:block}
}
/* auth */
body.auth #app{display:block}
body.auth .backdrop{display:none!important}
.auth-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:repeating-linear-gradient(45deg,rgba(197,155,242,.08) 0 1px,transparent 1px 44px),repeating-linear-gradient(-45deg,rgba(197,155,242,.08) 0 1px,transparent 1px 44px),radial-gradient(90% 60% at 50% 0%,#3a1170,transparent 60%),#1a0b2e}
.auth-wrap .sub a{color:#c79bf2}
.auth-card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 60px rgba(16,24,40,.12);padding:34px;width:100%;max-width:390px}
.auth-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:600;font-size:.9rem;margin-bottom:10px;transition:.15s}
.auth-btn:hover{background:var(--mist)}
.auth-or{display:flex;align-items:center;gap:12px;color:var(--gray);font-size:.78rem;margin:14px 0}
.auth-or::before,.auth-or::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:.9rem;margin-bottom:10px;font-family:inherit}
.auth-input:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.auth-link{font-size:.8rem;color:var(--gray);font-weight:500}
.auth-link:hover{color:var(--blue)}
.signout{margin-left:auto;color:var(--gray);font-size:.75rem;cursor:pointer}
.signout:hover{color:var(--red)}
</style>
</head>

<script>

/* ============ ICONS ============ */
const I={
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>',
  dumbbell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 9v6M5 7v10M19 7v10M22 9v6M7 12h10"/></svg>',

  card:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3 2.7-5 6-5s6 2 6 5"/><path d="M16 5.5a3 3 0 0 1 0 5.5M21 20c0-2.4-1.6-4.3-4-4.8"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>',

const NAV={
  client:[["today","Today",I.home],["workouts","Workouts",I.dumbbell],["nutrition","Nutrition",I.meal],

/* ============ STATE ============ */
let state={role:"client",page:"today",client:null,loggedIn:false,
  currentStack:["Workout Program — PPL 6-day","Nutrition Plan — 2,100 kcal cut","Cardio Program — 8k steps","Habit Program — Sleep & hydration","Check-in Schedule — Weekly","Education Videos — Fat loss basics"],

const SUPABASE_ANON_KEY = "sb_publishable_ZxgTmxueol1DuvUaZTYsKQ_j7xrFR5n";
/* ↑↑↑ once both are filled in, Google sign-in is live ↑↑↑ */
const sb = (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const ADMIN_EMAILS = ["stevenson@pacificridgewayinsurance.com", "coachjsd@yahoo.com", "gregorystevensonba@gmail.com", "coachjsandiego@gmail.com"];
let AUTH_USER = null, IS_ADMIN = false, MEMBERS = null, BOOKINGS = null;
async function signInGoogle(){
  if(!sb){ state.loggedIn=true; render(); return; }   // demo fallback until keys are added
  const { error } = await sb.auth.signInWithOAuth({ provider:"google", options:{ redirectTo: location.origin + location.pathname } });

}
async function doSignOut(){ if(sb){ try{ await sb.auth.signOut(); }catch(e){} } AUTH_USER=null; state.loggedIn=false; render(); }
function applyUser(u){
  if(!u){ AUTH_USER=null; IS_ADMIN=false; return; }
  const m=u.user_metadata||{}; const name=m.full_name||m.name||u.email||"Member";
  AUTH_USER={ name, email:u.email||"", avatar:m.avatar_url||m.picture||"",
    initials:(name.split(" ").map(x=>x[0]).slice(0,2).join("")||"U").toUpperCase() };
  IS_ADMIN = ADMIN_EMAILS.includes((u.email||"").toLowerCase());
}
async function onSignedIn(session){
  state.loggedIn=true; state.client=null; applyUser(session.user);
  state.role = IS_ADMIN ? "admin" : "client";
  state.page = IS_ADMIN ? "overview" : "today";

/* ============ HELPERS ============ */
const $=(s,el=document)=>el.querySelector(s);
function ring(pct,size=64,stroke=7,color="var(--blue)"){
  const r=(size-stroke)/2,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<svg width="${size}" height="${size}" class="ring"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--mist)" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}
function line(vals,w=460,h=120,color="#8b2fd6"){
  const min=Math.min(...vals),max=Math.max(...vals),pad=10;
  const pts=vals.map((v,i)=>{const x=pad+i*(w-2*pad)/(vals.length-1);const y=h-pad-((v-min)/(max-min||1))*(h-2*pad);return [x,y];});
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=d+` L${pts[pts.length-1][0].toFixed(1)} ${h} L${pts[0][0].toFixed(1)} ${h} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="none" style="height:${h}px"><defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".18"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#lg)"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="${color}"/>`).join("")}</svg>`;
}
function bars(vals,w=460,h=120,color="#8b2fd6"){
  const max=Math.max(...vals),bw=(w)/(vals.length)-8;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="height:${h}px">${vals.map((v,i)=>{const bh=(v/max)*(h-14);const x=i*(w/vals.length)+4;return `<rect x="${x}" y="${h-bh}" width="${bw}" height="${bh}" rx="5" fill="${i===vals.length-1?color:'#d8c5f0'}"/>`;}).join("")}</svg>`;
}
const statusPill={"on-track":'<span class="pill green">● On track</span>',"needs-nudge":'<span class="pill amber">● Needs nudge</span>',"at-risk":'<span class="pill red">● At risk</span>'};

function openWorkoutBuilder(block){
  if(!PROGRAMS[block]) PROGRAMS[block]=[];
  const inp="padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:.85rem;background:#fff";
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:400;display:grid;place-items:center;background:rgba(10,13,20,.5);backdrop-filter:blur(6px);padding:20px";
  ov.innerHTML='<div class="card pad" style="max-width:520px;width:100%;max-height:88vh;overflow:auto"><div class="between"><div><div class="eyebrow">Edit workout</div><h3 style="margin-top:2px">'+block+'</h3></div><button class="signout" id="wbx" style="font-size:1.3rem">✕</button></div><p class="sub" style="margin:6px 0 14px">Editing this updates it everywhere '+block+' is used.</p><div class="row" style="gap:8px;margin-bottom:6px"><div style="flex:2" class="sub">Exercise</div><div style="flex:1" class="sub">Sets × Reps</div><div style="width:64px" class="sub">Rest</div><div style="width:34px"></div></div><div id="wbrows"></div><div class="chip-add" id="wbadd" style="margin-top:6px">+ Add exercise</div><button class="btn" id="wbsave" style="width:100%;justify-content:center;margin-top:16px">Save workout</button></div>';
  document.body.appendChild(ov);
  const rows=ov.querySelector("#wbrows");
  const rowHTML=(ex,i)=>'<div class="row" style="gap:8px;margin-bottom:8px"><input value="'+(ex.n||"").replace(/"/g,"&quot;")+'" data-exn="'+i+'" placeholder="Exercise" style="flex:2;'+inp+'"><input value="'+(ex.s||"")+'" data-exs="'+i+'" placeholder="4 × 8" style="flex:1;'+inp+'"><input value="'+(ex.r||"")+'" data-exr="'+i+'" placeholder="90s" style="width:64px;'+inp+'"><button class="btn ghost sm" data-exdel="'+i+'" style="width:34px;padding:7px 0">✕</button></div>';
  const paint=()=>{rows.innerHTML=PROGRAMS[block].map(rowHTML).join("");};
  paint();
  const close=()=>ov.remove();
  ov.addEventListener("input",ev=>{const t=ev.target;if(t.dataset.exn!=null)PROGRAMS[block][+t.dataset.exn].n=t.value;if(t.dataset.exs!=null)PROGRAMS[block][+t.dataset.exs].s=t.value;if(t.dataset.exr!=null)PROGRAMS[block][+t.dataset.exr].r=t.value;});
  ov.addEventListener("click",ev=>{
    if(ev.target===ov||ev.target.closest("#wbx")){close();return;}
    if(ev.target.closest("#wbadd")){PROGRAMS[block].push({n:"",s:"3 × 10",r:"90s"});paint();return;}
    const del=ev.target.closest("[data-exdel]");if(del){PROGRAMS[block].splice(+del.dataset.exdel,1);paint();return;}
    if(ev.target.closest("#wbsave")){close();toast("Workout saved ✓");render();return;}
  });
}

document.addEventListener("click",e=>{
  const row=e.target.closest("[data-client]");
  if(row && !e.target.closest("button")){state.client={n:row.dataset.client};render();return;}
  if(e.target.closest("[data-back]")){state.client=null;render();return;}
  if(e.target.closest("[data-signout]")){doSignOut();return;}
  // client today interactions
  let el;
  if((el=e.target.closest("[data-habit]"))){c.habits[+el.dataset.habit].done=!c.habits[+el.dataset.habit].done;render();return;}
  if((el=e.target.closest("[data-meal]"))){c.meals[+el.dataset.meal].done=!c.meals[+el.dataset.meal].done;render();return;}
  if((el=e.target.closest("[data-ex]"))){c.workout.exercises[+el.dataset.ex].done=!c.workout.exercises[+el.dataset.ex].done;render();return;}
  if(e.target.closest("[data-water]")){c.water.cur=Math.min(c.water.goal,Math.round((c.water.cur+0.25)*100)/100);render();return;}
  if(e.target.closest("[data-complete-workout]")){const all=c.workout.exercises.every(x=>x.done);c.workout.exercises.forEach(x=>x.done=!all);render();toast(all?'Workout reset':'Great work — workout logged 💪');return;}
  // stack builder
  if((el=e.target.closest("[data-addmod]"))){if(!state.currentStack.includes(el.dataset.addmod)){state.currentStack.push(el.dataset.addmod);render();toast("Module added to stack");}else{toast("Already in stack");}return;}
  if((el=e.target.closest("[data-rmmod]"))){state.currentStack.splice(+el.dataset.rmmod,1);render();return;}
  if(e.target.closest("[data-savestack]")){toast(state.client?"90-day plan saved ✓":"Stack saved — pushed to 214 clients ✓");return;}
  if(e.target.closest("[data-addcstack]")){const cl=DATA.clients.find(x=>x.n===(state.client&&state.client.n));if(cl){const opts=DATA.stacks.map(s=>s+" — assigned");const pick=opts.find(o=>!cl.stack.includes(o))||("Custom module "+(cl.stack.length+1));cl.stack.push(pick);render();toast("Module added");}return;}
  if((el=e.target.closest("[data-delcstack]"))){const cl=DATA.clients.find(x=>x.n===(state.client&&state.client.n));if(cl){cl.stack.splice(+el.dataset.delcstack,1);render();}return;}
  if((el=e.target.closest("[data-editwk]"))){const cl=DATA.clients.find(x=>x.n===(state.client&&state.client.n));if(cl&&cl.plan){openWorkoutBuilder(cl.plan[+el.dataset.editwk].block);}return;}
  // admin: add / delete clients
  if(e.target.closest("[data-addclient-adm]")){ openAddClient(); return; }
  if((el=e.target.closest("[data-delclient]"))){
    const i=+el.dataset.delclient; const nm=(DATA.clients[i]&&DATA.clients[i].n)||"this client";
    if(confirm("Remove "+nm+"?")){ DATA.clients.splice(i,1); render(); toast("Client removed"); } return;
  }
  if((el=e.target.closest("[data-rmclient]"))){state.clientStack.splice(+el.dataset.rmclient,1);render();return;}
  if(e.target.closest("[data-addclient]")){const opts=["Mobility Program — 10 min daily","Supplement Guide — Cut phase","Challenge — 30-day steps","Recovery Program — Deload week"];const pick=opts.find(o=>!state.clientStack.includes(o))||opts[0];state.clientStack.push(pick);render();toast("Module added");return;}
});
window.addEventListener("resize",()=>{const mb=document.querySelector('.icon-btn.mobile-only');if(mb)mb.style.display=window.innerWidth<=900?'grid':'none';});
(async function init(){
  if(sb){
    try{ const { data } = await sb.auth.getSession();
      if(data && data.session){ await onSignedIn(data.session); }
    }catch(e){}
    sb.auth.onAuthStateChange((_e, session)=>{
      if(session){ onSignedIn(session); }
      else { state.loggedIn=false; AUTH_USER=null; IS_ADMIN=false; MEMBERS=null; render(); }
    });
  }
  render();
})();
</script>
