<style>
:root{
  --blue:#8b2fd6; --blue-2:#9d4ee0; --blue-050:#f3ebfc;
  --ink:#0a0d14; --slate:#4a5163; --gray:#8b91a1; --line:#e7eaf1; --mist:#f5f7fb; --white:#fff;

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--mist);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:var(--blue);color:#fff}
h1,h2,h3,h4{font-family:var(--display);letter-spacing:-.02em;line-height:1.15}
.muted{color:var(--gray)}
img{display:block;max-width:100%}

/* shell */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.15rem;padding:6px 8px 16px}
.brand .m{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:800;box-shadow:0 8px 20px rgba(139,47,214,.35)}
.brand span{color:var(--blue)}
.role-chip{margin:0 8px 14px;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);background:var(--blue-050);padding:6px 10px;border-radius:8px;display:inline-block;width:fit-content}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;font-weight:500;font-size:.92rem;color:var(--slate);transition:background .15s,color .15s}
.nav a svg{width:18px;height:18px;flex-shrink:0;opacity:.8}
.nav a:hover{background:var(--mist)}
.nav a.active{background:var(--blue-050);color:var(--blue);font-weight:600}
.nav a.active svg{opacity:1}
.side-foot{border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
.switcher{display:flex;background:var(--mist);border-radius:10px;padding:3px;margin-bottom:10px}
.switcher button{flex:1;font-size:.72rem;font-weight:600;padding:7px 4px;border-radius:8px;color:var(--gray)}
.switcher button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.user{display:flex;align-items:center;gap:10px;padding:6px 8px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.8rem;flex-shrink:0;background:linear-gradient(140deg,#9d4ee0,#4a1a86)}
.user .n{font-size:.85rem;font-weight:600;line-height:1.2}
.user .e{font-size:.72rem;color:var(--gray)}

.topbar{position:sticky;top:0;z-index:20;background:rgba(245,247,251,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:14px 28px}
.topbar h1{font-size:1.3rem}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--gray);font-size:.85rem;min-width:200px}
.search svg{width:15px;height:15px}
.icon-btn{width:38px;height:38px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--slate)}
.icon-btn svg{width:18px;height:18px}
.content{padding:28px}
.wrapx{max-width:1100px;margin:0 auto}

/* primitives */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
.pad{padding:22px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.88rem;padding:10px 16px;border-radius:10px;background:var(--blue);color:#fff;transition:.15s;box-shadow:0 6px 16px rgba(139,47,214,.28)}
.btn:hover{background:var(--blue-2)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:.8rem}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;padding:4px 10px;border-radius:100px;background:var(--mist);color:var(--slate)}

.pill.amber{background:rgba(255,159,67,.14);color:#c9741a}
.pill.red{background:rgba(255,90,95,.12);color:#d63b40}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gray)}
.big{font-family:var(--display);font-weight:800;font-size:2rem;letter-spacing:-.03em;line-height:1}
.sub{font-size:.82rem;color:var(--gray);margin-top:4px}
.divide{height:1px;background:var(--line);margin:16px 0}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--gray);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);font-size:.88rem}
tr:last-child td{border-bottom:none}
.trow:hover{background:var(--mist);cursor:pointer}
.progress{height:8px;border-radius:100px;background:var(--mist);overflow:hidden}
.progress i{display:block;height:100%;background:var(--blue);border-radius:100px}
.progress i.g{background:var(--green)}.progress i.a{background:var(--amber)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex-shrink:0;transition:.15s}
.check.done{background:var(--green);border-color:var(--green);color:#fff}
.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:none}
.ring{transform:rotate(-90deg)}
.list-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.tag{font-size:.7rem;font-weight:600;color:var(--gray);background:var(--mist);padding:3px 8px;border-radius:6px}

.stack-mod{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;font-size:.85rem;font-weight:500}
.stack-mod .h{margin-left:auto;color:var(--gray);cursor:grab}
.chip-add{border:1px dashed var(--line);color:var(--blue);border-radius:12px;padding:11px;text-align:center;font-weight:600;font-size:.85rem;cursor:pointer}
.seg{display:inline-flex;background:var(--mist);border-radius:10px;padding:3px}

.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.mobile-only{display:none}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;z-index:50;width:250px;transform:translateX(-100%);transition:transform .3s var(--ease);box-shadow:0 20px 60px rgba(0,0,0,.2)}
  body.menu .side{transform:none}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .content{padding:18px}
  .mobile-only{display:grid}
  .search{display:none}
  .backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
  body.menu .backdrop{display:block}

/* auth */
body.auth #app{display:block}
body.auth .backdrop{display:none!important}
.auth-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:repeating-linear-gradient(45deg,rgba(197,155,242,.08) 0 1px,transparent 1px 44px),repeating-linear-gradient(-45deg,rgba(197,155,242,.08) 0 1px,transparent 1px 44px),radial-gradient(90% 60% at 50% 0%,#3a1170,transparent 60%),#1a0b2e}

.auth-card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 60px rgba(16,24,40,.12);padding:34px;width:100%;max-width:390px}
.auth-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:600;font-size:.9rem;margin-bottom:10px;transition:.15s}

.auth-input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:.9rem;margin-bottom:10px;font-family:inherit}

.signout{margin-left:auto;color:var(--gray);font-size:.75rem;cursor:pointer}
.signout:hover{color:var(--red)}

      o.type="sine"; o.frequency.value=f; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001,t0+d);
      g.gain.exponentialRampToValueAtTime(0.16,t0+d+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+d+0.19);
      o.start(t0+d); o.stop(t0+d+0.22);
    });
  }catch(e){}
}
function buildState(){ return { v:1, clients:DATA.clients, programs:PROGRAMS }; }
let _saveTimer=null, _lastSaveOk=true;
function saveState(){
  if(!sb || !IS_ADMIN) return;
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(async ()=>{
    try{
      const { error } = await sb.from("coach_state").update({ data:buildState(), updated_at:new Date().toISOString(), updated_by:(AUTH_USER&&AUTH_USER.email)||"" }).eq("id",1);
      if(error) throw error;
      _lastSaveOk=true; playSaveSound(); toast("Saved ✓");
    }catch(e){ _lastSaveOk=false; toast("Couldn't save — check connection"); }
  }, 450);
}
async function loadState(){
  if(!sb || !IS_ADMIN) return;
  try{
    const { data, error } = await sb.from("coach_state").select("data").eq("id",1).single();
    if(!error && data && data.data){

      if(Array.isArray(s.clients) && s.clients.length) DATA.clients=s.clients;
      if(s.programs && typeof s.programs==="object") Object.assign(PROGRAMS, s.programs);
    }
  }catch(e){}
}

/* ============ HELPERS ============ */
const $=(s,el=document)=>el.querySelector(s);
function ring(pct,size=64,stroke=7,color="var(--blue)"){
  const r=(size-stroke)/2,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<svg width="${size}" height="${size}" class="ring"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--mist)" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}
function line(vals,w=460,h=120,color="#8b2fd6"){
  const min=Math.min(...vals),max=Math.max(...vals),pad=10;
  const pts=vals.map((v,i)=>{const x=pad+i*(w-2*pad)/(vals.length-1);const y=h-pad-((v-min)/(max-min||1))*(h-2*pad);return [x,y];});
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=d+` L${pts[pts.length-1][0].toFixed(1)} ${h} L${pts[0][0].toFixed(1)} ${h} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="none" style="height:${h}px"><defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".18"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#lg)"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="${color}"/>`).join("")}</svg>`;
}
function bars(vals,w=460,h=120,color="#8b2fd6"){
  const max=Math.max(...vals),bw=(w)/(vals.length)-8;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="height:${h}px">${vals.map((v,i)=>{const bh=(v/max)*(h-14);const x=i*(w/vals.length)+4;return `<rect x="${x}" y="${h-bh}" width="${bw}" height="${bh}" rx="5" fill="${i===vals.length-1?color:'#d8c5f0'}"/>`;}).join("")}</svg>`;
}

function openDay(blocks){
  blocks=(blocks||[]).filter(b=>b&&b!=="None"&&b!=="Rest / Deload");
  if(!blocks.length) blocks=["Chest"];
  blocks.forEach(b=>{ if(!PROGRAMS[b]) PROGRAMS[b]=[]; });
  const esc=s=>(s==null?"":(""+s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const inp="padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:.85rem;background:#fff";
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:400;display:grid;place-items:center;background:rgba(10,13,20,.5);backdrop-filter:blur(6px);padding:20px";
  const groupHTML=(b,gi)=>{
    const exs=PROGRAMS[b]||[];
    const rows=exs.map((ex,i)=>{
      const cues=(ex.cues&&ex.cues.length)?'<br>✅ '+ex.cues.map(esc).join('  ·  '):'';
      const detail='<div class="sub" style="font-size:.72rem;line-height:1.5;margin:1px 0 11px;color:var(--gray)">⏱ '+esc(ex.tempo||"controlled")+(ex.focus?'  ·  🎯 '+esc(ex.focus):'')+cues+'</div>';
      return '<div class="row" style="gap:8px;margin-bottom:2px"><input value="'+esc(ex.n)+'" data-bg="'+gi+'" data-exi="'+i+'" data-f="n" placeholder="Exercise" style="flex:2;'+inp+'"><input value="'+esc(ex.s)+'" data-bg="'+gi+'" data-exi="'+i+'" data-f="s" placeholder="3 × 12" style="flex:1;'+inp+'"><input value="'+esc(ex.r)+'" data-bg="'+gi+'" data-exi="'+i+'" data-f="r" placeholder="90s" style="width:64px;'+inp+'"><button class="btn ghost sm" data-exdel="'+gi+':'+i+'" style="width:34px;padding:7px 0">✕</button></div>'+detail;
    }).join("");

function ensureCli(cl){

function sparkline(vals,w,h,color){
  const min=Math.min(...vals),max=Math.max(...vals),rng=(max-min)||1;
  const pts=vals.map((v,i)=>{const x=(i/(vals.length-1))*(w-6)+3;const y=h-4-((v-min)/rng)*(h-8);return x.toFixed(1)+','+y.toFixed(1);}).join(' ');
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="max-width:100%"><polyline points="'+pts+'" fill="none" stroke="'+(color||'#8b2fd6')+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function bars(vals,w,h,color){
  const min=Math.min(...vals)*0.92,max=Math.max(...vals),rng=(max-min)||1,bw=w/vals.length;
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+vals.map((v,i)=>{const bh=((v-min)/rng)*(h-4)+3;const x=i*bw+bw*0.18;return '<rect x="'+x.toFixed(1)+'" y="'+(h-bh).toFixed(1)+'" width="'+(bw*0.64).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="'+(color||'#8b2fd6')+'"/>';}).join('')+'</svg>';
}
function macroRow(label,cur,goal,color){
  const pct=Math.min(100,Math.round(cur/goal*100));
  return '<div style="margin-top:12px"><div class="between"><span class="sub">'+label+'</span><span class="sub"><b style="color:var(--ink)">'+cur+'g</b> / '+goal+'g</span></div><div class="progress" style="margin-top:5px"><i style="width:'+pct+'%;background:'+color+'"></i></div></div>';
}

(async function init(){
  if(sb){
    try{ const { data } = await sb.auth.getSession();
      if(data && data.session){ await onSignedIn(data.session); }
    }catch(e){}
    sb.auth.onAuthStateChange((_e, session)=>{
      if(session){ onSignedIn(session); }
      else { state.loggedIn=false; AUTH_USER=null; IS_ADMIN=false; MEMBERS=null; render(); }
    });
  }
  render();
})();
</script>
</body>
</html>
